<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="./favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- 圖示與海圖背景熱連 huijistatic CDN,該 CDN 對外站 referer 回 403,必須不送 referer -->
        <meta name="referrer" content="no-referrer" />
        <link rel="stylesheet" href="./huijiwiki.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        />
        <script src="data.js"></script>
        <title>部隊潛水艇小工具(台服版)</title>
    </head>
    <body>
        <div id="wrapper">
            <div id="wiki-outer-body" class="huiji-css-hook">
                <div id="wiki-body" class="container">
                    <div id="content" class="row">
                        <article class="col-sm-12 wiki-body-section" role="main">
                            <section id="bodyContent" class="body">
                                <div id="mw-content-text" lang="zh-TW" dir="ltr" class="mw-content-ltr"
                                    ><div class="mw-parser-output" style="min-height: 1000px">
                                        <div id="app-submarine-tool">
                                            <div
                                                class="ff14-loading-block"
                                                style="min-height: 400px; text-align: center"
                                            >
                                                <div class="ff14-loading" style="margin-top: 150px"></div>
                                                <div>正在初始化,請稍候……</div>
                                            </div>
                                        </div>
                                    </div></div
                                >
                            </section>
                        </article>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
